# Codemagic builds the iPhone app on a cloud Mac and sends it to TestFlight.
# Two workflows: the full game and the free 1900 Edition. Start either one from the Codemagic dashboard.
definitions:
  steps: &ios_steps
    - &sort_files
      name: Sort files into folders
      script: |
        # Files uploaded through the GitHub website can land flat; put them where the build expects them.
        mkdir -p scripts resources src fonts
        for f in prepare.js patch-ios.js make-gamecenter.js gamecenter-setup.py; do [ -f "$f" ] && mv "$f" scripts/; done
        for f in icon-full.png icon-free.png splash.png splash-dark.png splash-full.png splash-free.png; do [ -f "$f" ] && mv "$f" resources/; done
        [ -f game.html ] && mv game.html src/
        for f in *.woff2; do [ -f "$f" ] && mv "$f" fonts/; done
        ls scripts resources src fonts
    - name: Game Center plugin
      script: node scripts/make-gamecenter.js
    - name: Install packages
      script: npm ci
    - name: Build the game for this edition
      script: node scripts/prepare.js $EDITION
    - name: Create the Xcode project
      script: |
        rm -rf ios
        npx cap add ios
    - name: App icon and launch screen
      script: |
        cp resources/icon-$EDITION.png resources/icon.png
        if [ -f resources/splash-$EDITION.png ]; then cp resources/splash-$EDITION.png resources/splash.png; cp resources/splash-$EDITION.png resources/splash-dark.png; fi
        npx @capacitor/assets generate --ios --assetPath resources --iconBackgroundColor '#efe4c8' --splashBackgroundColor '#efe4c8' --splashBackgroundColorDark '#efe4c8'
    - name: iPhone only, portrait, version numbers
      script: node scripts/patch-ios.js $PROJECT_BUILD_NUMBER
    - name: Copy the game into the app
      script: npx cap sync ios
    - name: Code signing
      script: xcode-project use-profiles
    - name: Build the app
      script: |
        if ! xcode-project build-ipa --project "ios/App/App.xcodeproj" --scheme "App"; then
          echo "===== Errors from Xcode ====="
          grep -h -E "error:|: error|requires a provisioning profile|doesn't include|entitlement" /tmp/xcodebuild_logs/*.log | sort -u | head -60
          exit 1
        fi

workflows:
  baron-full:
    name: Motor Baron (full game)
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: Motor Baron ASC
    environment:
      node: 22
      xcode: latest
      vars:
        EDITION: full
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.spencerdeville.motorbaron
    scripts: *ios_steps
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false

  baron-free:
    name: Motor Baron 1900 (free)
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: Motor Baron ASC
    environment:
      node: 22
      xcode: latest
      vars:
        EDITION: free
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.spencerdeville.motorbaron.free
    scripts: *ios_steps
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false

  gamecenter-setup:
    name: Set up Game Center (achievements and leaderboards)
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      groups:
        - app_store_credentials
      vars:
        BUNDLE_ID: com.spencerdeville.motorbaron
    scripts:
      - *sort_files
      - name: Create achievements in App Store Connect
        script: |
          python3 -m pip install --quiet pyjwt cryptography pillow || python3 -m pip install --quiet --break-system-packages pyjwt cryptography pillow
          python3 scripts/gamecenter-setup.py
