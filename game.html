/* ----- Difficulty, rivals fighting back, price pressure, labor ----- */
const DIFF={

 normal:{name:'Standard',d:'Rivals cut prices and bring out new cars when you take their buyers, buyers get pickier about price as the market matures, and big companies face labor trouble.',agg:1,press:1,cost:1},
 hard:{name:'Cutthroat',d:'Rivals fight hard for every buyer, prices fall fast, and labor costs bite.',agg:1.6,press:1.5,cost:1.5}
};
const DIFF_IDS=['easy','normal','hard'];
const dif=()=>DIFF[(state&&state.diff)||'normal']||DIFF.normal;
// Buyers grow more price-sensitive as a segment matures and more makers crowd in.
function segMature(s,Y){return clamp((Y-SEG[s].from-2)/10,0,1);}
function priceSens(s,Y){return 1+.6*dif().press*segMature(s,Y);}
// A famous name helps, but past a point buyers stop paying extra for it.
function repTerm(rep){const p=dif().press;const x=rep>70&&p?70+(rep-70)*(1-.5*Math.min(1,p)):Math.max(rep,30);return .02*(x-50);}
// Rivals in a segment where you hold a big share cut prices, push reputation and bring out new models early.
function rivalFight(m,Y,announce){
  const D=dif();state.fight=state.fight||{};if(!state.market) return;
  const mine={};state.models.forEach(x=>{const h=x.hist[x.hist.length-1];if(h&&h.m===m-1) mine[x.seg]=(mine[x.seg]||0)+(h.sold||0);});
  SEG_IDS.forEach(s=>{
    const tot=((state.market.segs||{})[s]||{}).sold||0;const sh=tot>0?(mine[s]||0)/tot:0;
    const f=state.fight[s]||(state.fight[s]={cut:1,told:false});
    if(D.agg>0&&sh>.15){const target=1-Math.min(.35,(.08+(sh-.15)*.6)*D.agg);f.cut=Math.max(target,f.cut-.035*D.agg);
      if(!f.told&&announce&&f.cut<.97){f.told=true;addNews('Rival makers are cutting prices on '+SEG[s].name.toLowerCase()+' cars to win back buyers from '+state.company.name+'.','warn');}}
    else{f.cut=Math.min(1,f.cut+.02);if(f.cut>=.995) f.told=false;}
    state.rivals.forEach(rv=>{
      if(!rv.active||rv.owner==='player') return;
      const def=byId(RIVAL_DEFS,rv.id);
      rv.models.forEach(rm=>{if(rm.seg!==s) return;const uc=rivalUnitCost(rm,rv,Y);rm.price=Math.round(Math.max(uc*1.04,uc*rv.markup*rvPriceMult(rv)*f.cut)/5)*5;});

        if(rm&&m-rm.launchM>=30&&rnd()<.2*D.agg){rivalLaunch(rv,s,m,announce);}
        const cap=(def&&def.weak?45:72)+8*D.agg;rv.rep=Math.min(cap,rv.rep+.4*D.agg);
      }
    });
  });
}
function fightCut(s){return state&&state.fight&&state.fight[s]?state.fight[s].cut:1;}
// Labor: big employers pay a little more; strikes; Ford's Five-Dollar Day in 1914.
function wageMult(){const D=dif();const b=builtLast();
  const size=clamp(Math.log10(Math.max(1,b)/500)/2,0,1);return (1+.12*D.cost*size)*(state.five==='yes'?1.6:1)*unionWage();}
function builtLast(){return state.factories.reduce((a,f)=>a+((f.last&&f.last.built)||0),0);}
function outMult(f){const Y=yearOf(state.m);return (state.five==='yes'?1.05:state.five==='no'&&Y<1920?.92:1)*(f&&f.strike>0?(f.sit?0:.5):1);}
function strikeOdds(Y){return Y>=1910&&Y<1923?1:Y>=1933&&Y<1942?1.6:Y>=1945&&Y<1951?1.2:.3;}
// Crew turnover, % of a factory's workers who quit each year. High turnover slows how fast crews improve.
function turnover(f){const Y=yearOf(state.m);
  let t=interp([[1900,45],[1910,70],[1913,260],[1916,130],[1920,110],[1925,80],[1930,45],[1933,20],[1937,35],[1942,60],[1946,45],[1955,30],[1970,35]],Y);
  if(state.five==='yes') t*=.35;if(state.union==='yes') t*=.6;
  const ass=Object.keys(f.prod||{});if(ass.length){const full=ass.filter(mid=>{const p=f.prod[mid];const c=prodCap(f,mid,p.lines,Y);return c>0&&p.target>=c*.95;}).length;if(full===ass.length) t*=1.25;}
  return Math.round(t);}
// True when every model at this factory is set at 95%+ of its capacity (the case that adds 25% to turnover).
function flatOut(f){const Y=yearOf(state.m);const ass=Object.keys(f.prod||{});return ass.length>0&&ass.every(mid=>{const p=f.prod[mid];const c=prodCap(f,mid,p.lines,Y);return c>0&&p.target>=c*.95;});}

function strikeOdds(Y){return Y>=1910&&Y<1923?1:Y>=1933&&Y<1942?1.6:Y>=1942&&Y<1945.6?.12:Y>=1945.6&&Y<1951?1.4:.35;}

function laborModal(){if(!state||state.over) return null;if(state.fivePending&&!state.five) return {type:'fiveday'};if(state.unionPending&&!state.union) return {type:'union'};if(state.contractPending) return {type:'contract'};return null;}
function biggestFactory(){return state.factories.filter(f=>!f.building).sort((a,b)=>Object.values(b.prod||{}).reduce((t,p)=>t+p.lines,0)-Object.values(a.prod||{}).reduce((t,p)=>t+p.lines,0))[0];}
function startStrike(f,months,sit,announce){if(!f) return;f.strike=months;f.sit=!!sit;if(announce) addNews(sit?'Sit-down strike! Workers occupy '+f.name+' and production there stops for about '+months+' month'+(months>1?'s':'')+'.':'Workers walk out at '+f.name+'. Output there is cut in half for '+(months>1?'about '+months+' months':'a month')+'.','bad');}
function laborMonth(m,Y,announce){

    if(f.building) return;const lines=Object.values(f.prod||{}).reduce((a,p)=>a+p.lines,0);if(lines<6) return;

function unitsShare12(extraRv){
  const m0=state.m-12;let mine=0,tot=0;
  state.models.forEach(x=>x.hist.forEach(h=>{if(h.m>=m0){mine+=h.sold;tot+=h.sold;}}));
  state.rivals.forEach(rv=>{rv.fin.forEach(f=>{if(f.m>=m0){tot+=f.units;if(rv.owner==='player'||rootOwner(rv)==='player'||(extraRv&&(rv===extraRv||rootOwner(rv)===extraRv.id))) mine+=f.units;}});});

}
function antitrustMonth(P,m,Y){

function govCandidates(c,m){
  const Y=yearOf(m);const out=[];
  state.models.forEach(x=>{if(x.status==='active'&&x.seg===c.seg&&x.price>0&&(x.saleFrom==null||x.saleFrom<=m)&&state.factories.some(f=>!f.building)) out.push({player:true,id:x.id,name:x.name,maker:state.company.name,score:govScore(ratingsAt(x.car,x.dy,Y),c.w)});});
  state.rivals.forEach(rv=>{const d=byId(RIVAL_DEFS,rv.id);if(!rv.active||(d&&d.foreign)) return;rv.models.forEach(rm=>{if(rm.seg===c.seg) out.push({player:false,rv:rv.id,rm:rm.id,name:rm.name,maker:rv.name,score:govScore(ratingsAt(rm.car,rm.dy,Y),c.w)});});});

function awardRival(c,cand,units,m){
  const rv=rvById(cand.rv);const rm=rv&&rv.models.find(x=>x.id===cand.rm);if(!rv||!rm) return false;const Y=yearOf(m);

function govOfferNext(c,m,unitsLeft){
  while(c.queue.length){
    const cand=c.queue.shift();
    if(cand.player){const x=byId(state.models,cand.id);if(!x||x.status!=='active') continue;state.gov.offer={cid:c.id,mid:cand.id,units:unitsLeft,m};addNews(c.buyer+' wants your '+x.name+' for its '+c.name+': about '+int(unitsLeft)+' a month for '+c.months+' months. It was judged the best design on offer. Decide on the Factories tab.','good');return;}

function govMonthStart(m){
  const g=state.gov||(state.gov={offer:null,done:{},q:{}});
  if(g.offer){const c=govContracts().find(x=>x.id===g.offer.cid);const left=g.offer.units;g.offer=null;if(c){c.queue=g.q[c.id]||[];govOfferNext(c,m,left);g.q[c.id]=c.queue;}}
  govContracts().forEach(c=>{
    if(c.m!==m||g.done[c.id]) return;g.done[c.id]=true;
    const units=Math.round(c.rate*potential(yearOf(m)));c.queue=govCandidates(c,m).slice(0,6);g.q[c.id]=c.queue;

  state.factories.forEach(f=>{if(f.gc&&m>=f.gc.until){addNews('The '+f.gc.name+' contract at '+f.name+' is complete. Its lines are free again.','info');f.gc=null;}
    const mx=warMaxLines(f,m);if((f.war||0)>mx){if(!warWindow(m)) addNews('War work at '+f.name+' has ended. Those lines are idle until you give them cars to build.','info');f.war=mx;}});

function govFactoryMonth(f,m,Y,P){
  let prof=0;const w=warWindow(m);
  if(w&&f.war>0){const rev=f.war*warLineRev(f,Y);prof+=rev*w.margin;}

function rivalGovMonth(rv,m,Y){
  let rev=0,pre=0;
  (rv.gc||[]).forEach(x=>{rev+=x.units*x.price;pre+=x.units*(x.price-x.cost);});

  {const rwN=regWeights(Y);C.rep=REGIONS.reduce((a,r)=>a+rwN[r.id]*regRep(r.id),0);}

  if(nm%12===0){const r=taxRate(yearOf(nm));const r0=taxRate(yearOf(nm-1));if(r!==r0) addNews('The federal corporate tax rate is now '+(r*100).toFixed(1)+'%.','warn');}
}

  {const live=state.factories.filter(f=>!f.building&&Object.keys(f.prod).length);if(live.length){const got=new Set();live.forEach(f=>{const sh=f.ship||{};if(sh.mode==='auto') serveList(f).forEach(r=>got.add(r));else if(sh.mode==='manual'){const shs=sh.shares||{};const tot=Object.values(shs).reduce((a,v)=>a+(+v||0),0);REGIONS.forEach(r=>{if(!tot||(+shs[r.id]||0)>0) got.add(r.id);});}Object.keys(f.prod).forEach(mid=>{const p=f.prod[mid];const n=Math.min(p.target,prodCap(f,mid,p.lines,Y));const pl=shipPlan(f,mid,n,Y)||{};Object.keys(pl).forEach(r=>{if(pl[r]>0) got.add(r);});});});
    const miss=REGIONS.filter(r=>hasDealers(r.id)&&!got.has(r.id));if(miss.length) out.push({sev:'warn',text:(miss.length===1?'No factory ships cars to '+miss[0].name+', where you have dealers.':'No factory ships cars to '+miss.length+' regions where you have dealers: '+miss.map(r=>r.name).join(', ')+'.')+' Check each factory\'s shipping plan.',act:'factories'});}}
  if(state.gov&&state.gov.offer){const o=state.gov.offer;const c=govContracts().find(x=>x.id===o.cid);const x=byId(state.models,o.mid);if(c&&x) out.push({sev:'good',text:c.buyer+' wants your '+esc(x.name)+' for its '+esc(c.name)+': about '+int(o.units)+' a month for '+c.months+' months. Decide before you end the month.',act:'govopen'});}
  {const w=warWindow(state.m);if(w&&state.factories.some(f=>!f.building&&(f.war||0)<warMaxLines(f,state.m)&&f.lines-Object.values(f.prod).reduce((a,p)=>a+p.lines,0)-govLines(f)>0)) out.push({sev:'info',text:'The government is buying war materiel for '+w.name+'. You have idle lines that could take war work.',act:'factories'});}

  else if(state.insolvent>0) out.push({sev:'bad',text:'You are out of cash and credit. '+(3-state.insolvent)+' month'+(3-state.insolvent===1?'':'s')+' left before bankruptcy. Cut costs, sell stock or raise prices.',act:'finance'});
  else{const pc=projectCash();if(pc.end<0) out.push({sev:'bad',text:'At last month\'s pace, you will end this month about '+money(-pc.end)+' short. Borrow now at '+(LOAN_RATE*100)+'% or the bank will step in with an emergency loan at '+(EMER_RATE*100)+'%, which also hurts your standing with dealers.',act:'finance'});}
  activeModels().forEach(x=>{
    const h=x.hist[x.hist.length-1];

    if(x.status==='active'&&!onLine&&!stockTotal(x.id)) out.push({sev:'warn',text:'The '+esc(x.name)+' is not assigned to any factory line, so nothing is being built.',act:'factories'});
    if(!h) return;
    if(h.missed>=5&&h.missed>.1*h.demand){if(inLaunch(x,h.m)) out.push({sev:'info',text:'Strong launch for the '+esc(x.name)+': '+int(h.missed)+' more buyers wanted one than you had in stock. New models get a couple of months to catch up, so this does not hurt your reputation yet. Build and ship more.',sel:x.id});else out.push({sev:'warn',text:'The '+esc(x.name)+' missed '+int(h.missed)+' sales last month ('+pct(h.missed/Math.max(1,h.demand))+' of demand).',sel:x.id});}
    const cv=coverMonths(x);if(x.status==='active'&&cv!=null&&cv>coverLimit()&&cv!==Infinity) out.push({sev:'warn',text:'The '+esc(x.name)+' has '+cv.toFixed(1)+' months of stock on hand.',sel:x.id});
    const h2=x.hist[x.hist.length-2];if(lv('books')>=1&&h.profit<0&&h2&&h2.profit<0) out.push({sev:'bad',text:'The '+esc(x.name)+' has lost money two months running.',sel:x.id});
  });
  state.factories.forEach(f=>{
    if(f.building) return;
    const used=Object.values(f.prod).reduce((a,p)=>a+p.lines,0)+govLines(f);
    if(used<f.lines) out.push({sev:'info',text:f.name+' has '+(f.lines-used)+' idle line'+(f.lines-used>1?'s':'')+'. Idle lines still cost money each month.',act:'factories'});
    Object.keys(f.prod).forEach(mid=>{const p=f.prod[mid];const x=byId(state.models,mid);if(x&&p.target>prodCap(f,mid,p.lines,Y)) out.push({sev:'info',text:'The '+esc(x.name)+' target at '+f.name+' is above what its lines can build ('+int(prodCap(f,mid,p.lines,Y))+'/mo).',act:'factories'});});
  });
  Object.keys(state.dealers).forEach(r=>{const d=state.dealers[r];if(d.n>0&&d.sat<45) out.push({sev:d.sat<35?'bad':'warn',text:'Dealers in '+REG[r].city+' are unhappy (satisfaction '+Math.round(d.sat)+').'+(d.sat<35?' They are starting to leave.':''),act:'regions'});});
  const lastP=state.fin.hist[state.fin.hist.length-1];
  if(lastP&&lv('books')>=3){const burn=lastP.branch+state.factories.reduce((a,f)=>a+(f.last?f.last.fixed:0),0);if(C.cash<burn*3) out.push({sev:'bad',text:'Cash covers less than three months of fixed costs.',act:'finance'});}
  if(state.fin.missPen>0) out.push({sev:'warn',text:'You turned away '+pct(state.fin.missRate)+' of buyers last month. Missing more than 10% hurts your reputation.'});
  const qm=nextTaxMonth(state.m);const est=estTax();

  {const recent=state.news.filter(n=>n.m===state.m-1&&(n.kind==='rival'||n.kind==='good'));
   const rd=recent.filter(n=>n.text.startsWith('Research breakthrough: '));
   if(rd.length){const parts=rd.map(n=>{const mm=n.text.match(/^Research breakthrough: (.+?) reaches level (\d+)/);return mm?mm[1]+' (level '+mm[2]+')':n.text;});out.push({sev:'good',text:'Research breakthrough'+(rd.length>1?'s':'')+': '+esc(parts.join(', '))+'. New designs you start get '+(rd.length>1?'them':'it')+' from now on.',act:'design'});}
   recent.filter(n=>!rd.includes(n)).slice(0,4).forEach(n=>out.push({sev:n.kind==='rival'?'rival':'good',text:esc(n.text)}));}

  state.factories.filter(f=>f.strike>0).forEach(f=>out.push({sev:'bad',text:(f.sit?'Sit-down strike at ':'Strike at ')+esc(f.name)+': '+(f.sit?'production there is stopped':'output there is cut in half')+(f.strike>1?' for about '+f.strike+' more months.':' this month.'),act:'factories'}));
  const rank={bad:0,warn:1,good:2,info:3,rival:4};
  return out.sort((a,b)=>rank[a.sev]-rank[b.sev]).slice(0,9);
}
function nextTaxMonth(m){let q=m;while(q%3!==2) q++;return q;}
function estTax(){const m=state.m;const Y=yearOf(m);const done=m%3;const qtd=state.fin.qtd;const last=state.fin.hist[state.fin.hist.length-1];const run=last?last.pretax:0;const remaining=2-done+1;const proj=qtd+run*(remaining);return Math.max(0,proj)*taxRate(Y);}

function spark(vals,w,h){
  w=w||84;h=h||24;if(!vals||vals.length<2) return '<svg class="spark" width="'+w+'" height="'+h+'" aria-hidden="true"></svg>';
  const mn=Math.min(...vals,0),mx=Math.max(...vals,0);const span=(mx-mn)||1;
  const pts=vals.map((v,i)=>[2+i*(w-6)/(vals.length-1),2+(h-4)*(1-(v-mn)/span)]);
  const zy=2+(h-4)*(1-(0-mn)/span);
  const line=pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  const area='M'+pts[0][0].toFixed(1)+','+zy.toFixed(1)+' L'+line.split(' ').join(' L')+' L'+pts[pts.length-1][0].toFixed(1)+','+zy.toFixed(1)+' Z';
  const last=pts[pts.length-1];const up=vals[vals.length-1]>=vals[vals.length-2];
  return '<svg class="spark" width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'" aria-hidden="true"><line x1="0" x2="'+w+'" y1="'+zy.toFixed(1)+'" y2="'+zy.toFixed(1)+'" stroke="var(--line)" stroke-width="1"/><path d="'+area+'" fill="var(--accent)" fill-opacity=".12"/><polyline points="'+line+'" fill="none" stroke="var(--accent)" stroke-width="1.5"/><circle cx="'+last[0].toFixed(1)+'" cy="'+last[1].toFixed(1)+'" r="2.6" fill="'+(up?'var(--good)':'var(--bad)')+'"/></svg>';
}

const CASHNOTE='<p class="hint"><b>Why cash and profit differ:</b> you pay for a car when it is built, but it counts against profit only when it sells. Building ahead lowers cash but not profit. Selling cars built in earlier months brings in cash while profit still counts their cost. Loans add cash but are not profit, and factory building uses cash without counting as a loss.</p>';

function viewFortune(){

  let h='';
  h+='<section class="panel"><div class="panel-head"><h2>'+esc(state.owner?ownerName():'Your fortune')+'</h2><button class="btn small" data-act="owneropen">'+(state.owner?'Change name':'Enter your name')+'</button></div>'+
    '<div class="kpis fkpis"><div class="kpi"><label>Net worth</label><b>'+money(nw.total)+'</b><span>Your score</span></div><div class="kpi"><label>Personal cash</label><b>'+money(me.cash)+'</b><span>Yours to spend</span></div><div class="kpi"><label>Homes and belongings</label><b>'+money(nw.prop)+'</b><span>What they would sell for</span></div><div class="kpi"><label>Upkeep</label><b>'+money(upkeepTotal())+'</b><span>A month, from personal cash</span></div><div class="kpi"><label>Given away</label><b>'+money(given)+'</b><span>'+(given?'Lasting goodwill':'Nothing yet')+'</span></div></div>'+(me.cash<0?'<div class="alert bad"><span class="chip bad">Act</span><span>You owe '+money(-me.cash)+'. Sell something below, sell shares on the Stocks tab, or raise the dividend. After 3 months in debt, creditors force a sale at a steep discount.</span></div>':'')+
    '<p class="hint">Personal cash comes from dividends (set one on the Stocks tab), dividends from shares you own, or selling shares. Company cash cannot be spent here.</p></section>';
  const row=(it,price,btn,sub,own)=>'<div class="fitem'+(own?' own':'')+'"><div><b>'+esc(it)+'</b><div class="small muted">'+sub+'</div></div><div class="fbuy"><span class="num">'+money(price)+'</span>'+btn+'</div></div>';
  h+='<section class="panel"><div class="panel-head"><h2>Live like a baron</h2><span class="muted small">Everything you own costs upkeep every month. Homes, art and teams rise and fall with the economy; boats, planes and horses lose value as they age. You can sell anything you own.</span></div><div class="flist">';
  LUX.forEach(it=>{const nm=luxName(it,Y);const b=me.buys.find(x=>x.id===it.id);
    if(b){const nb=luxName(it,yearOf(b.m),b.v||(it.id==='island'&&westHome()?'isle':undefined));const own=it.named&&b.nm?b.nm:nb;const bi=me.buys.indexOf(b);
      h+='<div class="fitem own"><div><b>'+esc(own)+'</b><div class="small muted">'+(own!==nb?esc(nb)+' · ':'')+'Bought '+dateShort(b.m)+' for '+money(b.paid)+'<br>Worth about '+money(luxValue(b))+' · upkeep '+money(luxUpkeep(b))+' a month</div></div><div class="fbuy"><span class="chip good">Owned</span><button class="btn small" data-act="luxsell" data-i="'+bi+'">Sell</button></div></div>';return;}
    if(!luxOK(it,Y)){if((it.from||0)>Y) h+='<div class="fitem off"><div><b>'+esc(nm)+'</b><div class="small muted">Not until '+it.from+'</div></div></div>';return;}
    const price=Math.round(it.cost*ci/100)*100;const can=me.cash>=price;
    h+=row(nm,price,'<button class="btn small'+(can?' primary':'')+'" data-act="buyopen" data-id="'+it.id+'" '+(can?'':'disabled')+'>'+(can?'Buy':'Need '+money(price-me.cash)+' more')+'</button>',luxDesc(it,Y));});
  h+='</div></section>';
  h+='<section class="panel"><div class="panel-head"><h2>Give it away</h2><span class="muted small">Gifts carry your name and lift your reputation for good: most in the region you choose, some nearby.</span></div><div class="flist">';
  GIFTS.forEach(it=>{const n=ownsCount(it.id);const once=!it.many;const price=Math.round(it.cost*ci/1000)*1000;const can=me.cash>=price;
    const eff=(it.gw?'Reputation +'+it.gw+' in one region':'')+(it.nat?(it.gw?', ':'')+'+'+it.nat+' everywhere':'');
    if(once&&n){const b=me.buys.find(x=>x.id===it.id);h+=row(b.nm,0,'<span class="chip good">Founded</span>','Founded '+dateShort(b.m)+' with '+money(b.paid),true).replace('<span class="num">'+money(0)+'</span>','');return;}
    h+=row(it.name+(n?' · '+n+' given':''),price,'<button class="btn small'+(can?' primary':'')+'" data-act="buyopen" data-id="'+it.id+'" '+(can?'':'disabled')+'>'+(can?'Give':'Need '+money(price-me.cash)+' more')+'</button>',it.d+' '+eff+'.'+(n?'<br><b>Given:</b> '+giftList(it.id,3):''));});
  h+='</div></section>';
  const gifts=me.buys.filter(b=>b.kind==='give');
  if(gifts.length) h+='<section class="panel"><h2>Your legacy</h2><div class="flist">'+gifts.slice().reverse().map(b=>{const r=REGIONS.find(x=>x.id===b.rid);return '<div class="fitem"><div><b>'+esc(b.nm)+'</b><div class="small muted">'+(r?esc(r.city)+' · ':'')+dateShort(b.m)+'</div></div><div class="fbuy"><span class="num">'+money(b.paid)+'</span></div></div>';}).join('')+'</div></section>';
  return h;
}

function maxFloors(Y){return interp([[1900,4],[1912,7],[1925,13],[1935,18],[1955,22],[1970,30]],Y);}
function lotBuilding(x,y,Y){
  const d=dist(x,y),R=townR(Y);
  if(d>R+2) return null;
  const h1=hash(x,y,1),h2=hash(x,y,2),h3=hash(x,y,3);
  const core=clamp(1-d/R,0,1);
  if(d>R) return h1<.55?{type:'house',f:1+(h2<.3?1:0)}:null;   // suburbs
  if(hash(x,y,41)<.03&&d>3&&d<R*.9) return {type:'church'};
  if(h1>(.55+.45*core)) return null;
  const mf=maxFloors(Y);
  let f=1+(mf-1)*Math.pow(core,1.7)*(.45+.55*h2);
  f=Math.max(1,Math.round(f));
  if(f<=2&&d>R*.7) return {type:'house',f};
  if(d<=R*.7) f=Math.max(f,2);
  if(f>=8&&Y>=1950&&h3<.5) return {type:'glass',f};
  if(f>=6&&Y>=1915) return {type:'deco',f};
  return {type:'brick',f:Math.max(2,f)};
}

      const sea=isSea(x,y),gk2=geo().coast;

      // engraved hatching

       ctx.strokeStyle='rgba(40,70,75,.28)';ctx.lineWidth=.7;for(let i=-3;i<=3;i++){const yy=cy0+i*4.2,o=((x*7+y*3+i*5)%9)-4;ctx.beginPath();ctx.moveTo(cx0-22+o,yy);ctx.lineTo(cx0+(i%2?10:18)+o,yy);ctx.stroke();}ctx.restore();}
      const rb=riverX(y),inb=(u,v)=>u>=X0&&v>=Y0&&u<X1&&v<Y1,ek='rgba(46,36,27,.6)';
      if(inb(x-1,y)&&!isWater(x-1,y)){line(ctx,P(x,y,0),P(x,y+1,0),ek,1.1);line(ctx,P(x+.16,y,0),P(x+.16,y+1,0),'rgba(40,70,75,.35)',.6);if(sea) line(ctx,P(x+.34,y+.15,0),P(x+.34,y+.85,0),'rgba(40,70,75,.22)',.5);}
      if(inb(x+1,y)&&!isWater(x+1,y)) line(ctx,P(x+1,y,0),P(x+1,y+1,0),ek,1.1);
      if(inb(x,y-1)&&!isWater(x,y-1)) line(ctx,P(x,y,0),P(x+1,y,0),ek,1.1);
      if(inb(x,y+1)&&!isWater(x,y+1)) line(ctx,P(x,y+1,0),P(x+1,y+1,0),ek,1.1);
      // bridges (rivers only)
      if(!sea){
        if(roadAt(rb-1,y,Y)&&roadAt(rb+riverW(),y,Y)&&(y%4===0||y===12)) add(x+y+1.2,c=>bridge(c,x,y,'road',Y));
        if(y===railRow) add(x+y+1.2,c=>bridge(c,x,y,'rail',Y));

    }
    if(isBeach(x,y)&&!(CITY.home&&built.yacht&&x===dockX()&&Math.abs(y-DOCK_Y)<=1)){quad(ctx,x,y,x+1,y+1,0,(x+y)%2?'#e8d9ab':'#e2d2a2');

      const e=roadAt(x+1,y,Y)||roadAt(x-1,y,Y)||isWater(x+1,y)||isWater(x-1,y),s=roadAt(x,y+1,Y)||roadAt(x,y-1,Y);

      }
      if(!pv&&hash(x,y,12)<.5){line(ctx,P(x+.2,y+.35,0),P(x+.8,y+.35,0),'rgba(120,95,60,.25)',1);line(ctx,P(x+.2,y+.65,0),P(x+.8,y+.65,0),'rgba(120,95,60,.25)',1);}

  if(ptrs.size===1){downAt={x:e.clientX,y:e.clientY,t:performance.now()};moved=0;}
  if(ptrs.size===2){const [a,b]=[...ptrs.values()];pinch={cz:cc.z,d:Math.hypot(a.x-b.x,a.y-b.y),z:cam.z,w:toWorld((a.x+b.x)/2,(a.y+b.y)/2)};}
});

  if(view==='country'){if(ptrs.size===1&&!pinch){cc.x+=dx;cc.y+=dy;clampCC();}else if(ptrs.size===2&&pinch){const [a,b]=[...ptrs.values()];zoomCC(pinch.cz*Math.hypot(a.x-b.x,a.y-b.y)/pinch.d,(a.x+b.x)/2,(a.y+b.y)/2);moved+=99;}moved+=Math.abs(dx)+Math.abs(dy);return;}
  if(ptrs.size===1&&!pinch){cam.x-=dx/cam.z;cam.y-=dy/cam.z;moved+=Math.abs(dx)+Math.abs(dy);clampCam();}
  else if(ptrs.size===2&&pinch){const [a,b]=[...ptrs.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);cam.z=pinch.z*d/pinch.d;clampCam();const mx=(a.x+b.x)/2,my=(a.y+b.y)/2;cam.x=pinch.w[0]-(mx-vw/2)/cam.z;cam.y=pinch.w[1]-(my-vh/2)/cam.z;clampCam();moved+=99;}
});
function up(e){if(!ptrs.has(e.pointerId))return;ptrs.delete(e.pointerId);
  if(ptrs.size<2) pinch=null;

function tap(x,y){
  if(view==='country'){tapCountry(x,y);return;}
  for(let i=pinRects.length-1;i>=0;i--){const r=pinRects[i];if(x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h){openSite(r.k);return;}}

  let best=null,bd=1e9;for(const k in tops){if(!show[k])continue;const [sx,sy]=toScreen(tops[k][0],tops[k][1]);const d=Math.hypot(sx-x,(sy+40*cam.z)-y);if(d<bd){bd=d;best=k;}}

  if(rows.length) h+='<h3>Your cars</h3><table class="rvt"><tr><th></th><th>Built</th><th>Sold</th><th>Missed</th></tr>'+rows.map(r=>'<tr><td>'+esc(r.n)+'</td><td>'+r.b.toLocaleString('en-US')+'</td><td>'+r.s.toLocaleString('en-US')+'</td><td'+(r.mi?' class="neg"':'')+'>'+r.mi.toLocaleString('en-US')+'</td></tr>').join('')+'</table>';
  const races=(S.races&&S.races.mine||[]).filter(r=>r.m===pm);
  if(races.length) h+='<h3>At the races</h3>'+races.map(r=>{const T=HOST.RACE_TYPES[r.type]||{name:'Race'};const city=(HOST.REG[r.region]||{}).city||'';const pl=r.place;const ord=n=>n+(n%10===1&&n%100!==11?'st':n%10===2&&n%100!==12?'nd':n%10===3&&n%100!==13?'rd':'th');
    return '<p class="rvline"><b>'+esc(r.model||'Your car')+'</b> '+(pl?'finished '+ord(pl)+(r.n?' of '+r.n:''):'broke down')+' in the '+esc(T.name.toLowerCase())+' at '+esc(city)+'.'+(pl===1?' A win!':'')+'</p>';}).join('');
  const al=(HOST.computeAlerts()||[]).slice(0,6);const L={bad:'Act',warn:'Watch',good:'News',info:'Note',rival:'Rival'};
  if(al.length) h+='<h3>Briefing</h3><div class="alerts">'+al.map(a=>'<div class="alert '+a.sev+'"><span class="chip '+a.sev+'">'+L[a.sev]+'</span><span>'+a.text+'</span></div>').join('')+'</div>';
  {const nz=t=>{const d=document.createElement('div');d.innerHTML=String(t||'');return (d.textContent||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();};const seen=new Set(al.map(a=>nz(a.text)));fresh=fresh.filter(n=>!seen.has(nz(n.text)));}
  if(fresh.length) h+='<h3>In the papers</h3>'+fresh.slice(0,6).map(n=>'<p class="rvline">'+n.text+'</p>').join('')+(fresh.length>6?'<p class="rvline muted">And '+(fresh.length-6)+' more on the News page.</p>':'');
  h+='<div class="row2"><button class="mbtn" data-act="tab" data-tab="overview" id="rvOv">Full overview</button><button class="mbtn ghost" id="rvClose">Back to the map</button></div></div>';
  return h;}
function reviewCheck(){const S=HOST.state;if(!S||!S.fin) return;
  if(RVM===null||S.m<RVM||S.m>RVM+1){RVM=S.m;RVTOP=S.news&&S.news[0];return;}
  if(S.m===RVM) return;
  const fresh=RVFRESH||[];RVFRESH=null;
  RVM=S.m;RVTOP=S.news&&S.news[0];
  if(S.over||!S.fin.hist.length||HOST.ui.tab!=='map') return;
  let el=document.getElementById('review');if(!el){el=document.createElement('div');el.id='review';document.getElementById('mapview').appendChild(el);}
  el.innerHTML=reviewHTML(S,fresh);el.hidden=false;try{$('toast').classList.remove('show');}catch(e){}try{closePanel();}catch(e){}
  const close=()=>{el.hidden=true;try{lettersCheck();}catch(e){}};
  document.getElementById('rvClose').onclick=close;document.getElementById('rvOv').addEventListener('click',()=>{el.hidden=true;});
  el.onclick=e=>{if(e.target===el) close();};}

let CURSITE=null;
const OP=()=>HOST.mapOps;
function priceRows(){const S=HOST.state;const ms=OP().models();if(!ms.length) return '<p class="muted">No cars on sale yet.</p>';
  const ls=S.lastSales||{};
  return '<div class="mprices">'+ms.map(x=>{const q=ls[x.id]&&ls[x.id][CITY.id];const sold=q?q.sold||0:0;
    return '<div class="mprow"><div class="mpn"><b>'+esc(x.name)+'</b><span>'+sold+' sold here last month'+(x.status==='discontinued'?' · selling off, '+x.left+' left':'')+'</span></div><div class="mpc"><button class="mbtn ghost" data-mop="pdn" data-id="'+x.id+'">−</button><span class="mpv">$<input inputmode="numeric" data-mprice="'+x.id+'" value="'+x.price+'"></span><button class="mbtn ghost" data-mop="pup" data-id="'+x.id+'">+</button></div></div>';}).join('')+'</div><p class="mphint">Prices are the same in every region. − and + move them by $25.</p>';}
function bankBox(){const b=OP().bankInfo();const M=HOST.money;const amts=[1000,5000,10000,25000].filter(a=>a<=Math.max(b.room,b.debt,1000)*1.01);
  return KV([['Company cash',M(b.cash)],['You owe',M(b.debt)],['Bank will still lend',M(b.room)],['Interest',Math.round(b.rate*1000)/10+'% a year']])+
   '<div class="mbank"><label>Amount</label><div class="mamts">'+amts.map(a=>'<button class="mbtn ghost" data-mop="amt" data-v="'+a+'">'+M(a)+'</button>').join('')+'</div><input inputmode="numeric" id="mAmt" value="'+(amts[1]||amts[0]||1000)+'">'+
   '<div class="mrow2"><button class="mbtn" data-mop="borrow"'+(b.room>0?'':' disabled')+'>Borrow</button><button class="mbtn ghost" data-mop="repay"'+(b.debt>0?'':' disabled')+'>Repay</button></div>'+(b.debt>0?'<button class="mbtn ghost" data-mop="repayall">Repay everything you can</button>':'')+'</div>';}
function raceBox(){const rs=OP().races(CITY.id,6);const cars=OP().racers();const fee=HOST.money(OP().raceFee());const hasD=(DEALERS[CITY.id]||0)>0;
  if(!rs.length) return '<p class="muted">No events here in the next six months.</p>';
  return (hasD?'':'<p class="mphint">You have no dealers in '+esc(CITY.region)+'. A good result still builds your name here for later.</p>')+'<div class="mraces">'+rs.map(r=>{
    const ent=r.entered?(HOST.state.models.find(x=>x.id===r.entered)||{}).name:null;
    return '<div class="mrace"><div class="mrt"><b>'+esc(r.name)+'</b><span>'+(r.now?'This month':esc(r.when))+'</span></div><div class="mrd">Wins on '+esc(r.wins.toLowerCase())+'.</div>'+
      (ent?'<div class="mre">Entered: <b>'+esc(ent)+'</b> <button class="mbtn ghost" data-mop="wd" data-k="'+r.key+'">Withdraw</button></div>':
       cars.length?'<div class="mre"><select data-msel="'+r.key+'">'+cars.map(c=>'<option value="'+c.id+'">'+esc(c.name)+'</option>').join('')+'</select><button class="mbtn" data-mop="enter" data-k="'+r.key+'">Enter · '+fee+'</button></div>':'<div class="mre muted">Build a car first.</div>')+'</div>';}).join('')+'</div>';}
function refreshSite(msg){if(CURSITE&&String(CURSITE).startsWith('region:')&&$('panel').classList.contains('open')){openRegion(CURSITE.slice(7));if(msg) toast(msg,2600);return;}if(CURSITE&&$('panel').classList.contains('open')){const f=SITE_INFO[CURSITE];if(f){$('pB').innerHTML=f();}}if(msg) toast(msg,2600);}
$('pB').addEventListener('click',e=>{const b=e.target.closest('[data-mop]');if(!b) return;e.stopPropagation();const o=b.dataset.mop,O=OP();let msg='';
  if(o==='pup'||o==='pdn'){const x=HOST.state.models.find(m=>m.id===b.dataset.id);O.setPrice(x.id,x.price+(o==='pup'?25:-25));}
  else if(o==='amt'){$('mAmt').value=b.dataset.v;return;}
  else if(o==='borrow') msg=O.borrow(+$('mAmt').value);
  else if(o==='repay') msg=O.repay(+$('mAmt').value);
  else if(o==='repayall') msg=O.repay(O.bankInfo().debt);
  else if(o==='enter'){const s=$('pB').querySelector('[data-msel="'+b.dataset.k+'"]');msg=O.enterRace(b.dataset.k,s&&s.value);}
  else if(o==='wd') msg=O.withdrawRace(b.dataset.k);
  else if(o==='ln') O.act('lines',{f:b.dataset.f,id:b.dataset.id,d:b.dataset.d});
  else if(o==='tg') O.act('tstep',{f:b.dataset.f,id:b.dataset.id,d:b.dataset.d});
  else if(o==='tmax') O.act('maxtarget',{f:b.dataset.f,id:b.dataset.id});
  else if(o==='assign'){const s=$('pB').querySelector('[data-msel="as-'+b.dataset.f+'"]');msg=O.assign(b.dataset.f,s&&s.value);}
  else if(o==='newdesign'){closePanel();O.newDesign();return;}
  else if(o==='serve'){O.toggleServe(b.dataset.f,b.dataset.r,b.dataset.on==='1');}
  else if(o==='addn'){ADDN[b.dataset.f]=Math.max(1,Math.min(20,(ADDN[b.dataset.f]||1)+(+b.dataset.d)));}
  else if(o==='addlines'){msg=O.addLines(b.dataset.f,ADDN[b.dataset.f]||1);ADDN[b.dataset.f]=1;}
  else if(o==='upg'){msg=O.upgrade(b.dataset.f,b.dataset.to);}
  else if(o==='dl'){O.act('dstep',{r:b.dataset.r,d:b.dataset.d});}
  refreshSite(msg);},true);
$('pB').addEventListener('change',e=>{const i=e.target.closest('[data-mprice]');if(!i) return;OP().setPrice(i.dataset.mprice,+String(i.value).replace(/[^0-9]/g,'')||0);refreshSite('Price set.');});

function worksBox(){const ws=OP().works(CITY.id);return ws.map(w=>{
  if(w.building) return '<div class="mwork"><b>'+esc(w.name)+'</b><p class="mphint">Under construction. Opens in '+w.monthsLeft+' month'+(w.monthsLeft===1?'':'s')+'.</p></div>';
  let h='<div class="mwork"><div class="mrt"><b>'+esc(w.name)+'</b><span>'+w.used+' of '+w.lines+' lines in use · '+esc(w.method)+'</span></div>';
  h+=w.prod.length?w.prod.map(p=>'<div class="mprod"><div class="mpn"><b>'+esc(p.name)+'</b><span>'+p.lines+' line'+(p.lines===1?'':'s')+' · up to '+p.cap+' a month</span></div>'+(p.missed>0?'<div class="mmiss"><b>Missed '+p.missed+' sale'+(p.missed===1?'':'s')+' last month.</b> Buyers wanted '+(p.sold+p.missed)+' and dealers had '+(p.sold?'only '+p.sold:'none')+' to sell. Build more'+(p.target<p.cap?'':' (add a line)')+'.</div>':p.stock>p.sold*3&&p.sold>0?'<div class="mmiss ok">'+p.stock+' unsold at dealers, about '+Math.round(p.stock/p.sold)+' months of sales. You could build fewer.</div>':'')+
    '<div class="mctl"><span class="mlab">Lines</span><button class="mbtn ghost" data-mop="ln" data-f="'+w.id+'" data-id="'+p.mid+'" data-d="-1">−</button><b class="mval">'+p.lines+'</b><button class="mbtn ghost" data-mop="ln" data-f="'+w.id+'" data-id="'+p.mid+'" data-d="1"'+(w.used>=w.lines?' disabled':'')+'>+</button></div>'+
    '<div class="mctl"><span class="mlab">Build a month</span><button class="mbtn ghost" data-mop="tg" data-f="'+w.id+'" data-id="'+p.mid+'" data-d="-1">−</button><b class="mval">'+p.target+'</b><button class="mbtn ghost" data-mop="tg" data-f="'+w.id+'" data-id="'+p.mid+'" data-d="1"'+(p.target>=p.cap?' disabled':'')+'>+</button><button class="mbtn ghost mmax" data-mop="tmax" data-f="'+w.id+'" data-id="'+p.mid+'">Max</button></div></div>').join(''):'<p class="mphint">No cars on the lines yet.</p>';
  h+=shipBox(w.id)+growBox(w.id);
  if(w.free.length&&w.used<w.lines) h+='<div class="mre"><select data-msel="as-'+w.id+'">'+w.free.map(c=>'<option value="'+c.id+'">'+esc(c.name)+'</option>').join('')+'</select><button class="mbtn" data-mop="assign" data-f="'+w.id+'">Put on a line</button></div>';
  return h+'</div>';}).join('');}
function studioBox(){const s=OP().studio();let h='';
  h+=s.projects.length?s.projects.map(p=>'<div class="mrace"><div class="mrt"><b>'+esc(p.name)+'</b><span>'+p.left+' month'+(p.left===1?'':'s')+' left</span></div><div class="mrd">'+esc(p.seg)+' · ready '+esc(p.when)+'</div></div>').join(''):'<p class="mphint">Nothing on the drawing boards.</p>';
  if(s.idle.length) h+='<p class="mphint"><b>Ready but not being built:</b> '+s.idle.map(esc).join(', ')+'. Put '+(s.idle.length>1?'them':'it')+' on a factory line.</p>';
  return h+'<button class="mbtn" data-mop="newdesign">Start a new design</button>';}
function dealerBox(id){const d=OP().dealerInfo(id);
  return '<div class="mprow"><div class="mpn"><b>Dealers</b><span>'+d.n+' signed · room for '+d.slots+(d.target>d.n?' · '+(d.target-d.n)+' more signing':'')+'</span></div><div class="mpc"><button class="mbtn ghost" data-mop="dl" data-r="'+id+'" data-d="-1"'+(d.target<=0?' disabled':'')+'>−</button><b class="mval">'+d.target+'</b><button class="mbtn ghost" data-mop="dl" data-r="'+id+'" data-d="1"'+(d.target>=d.slots?' disabled':'')+'>+</button></div></div><p class="mphint">Set how many dealers you want here. New ones sign over the next months. Fewer does not drop dealers you already have.</p>';}

function shipBox(fid){const s=OP().ship(fid);if(!s) return '';let h='<h4 class="mh">Shipping</h4>';
  if(!s.regions.length) return h+'<div class="mwarn"><b>No dealers yet.</b> Cars you build have nowhere to go, so they pile up unsold at the works in '+esc(s.home)+'. Sign dealers first.<button class="mbtn" data-act="tab" data-tab="regions">Sign dealers</button></div>';
  if(s.mode==='auto') h+='<p class="mphint">Cars go to every region where you have dealers, more to where they sell best. Tap a region to stop or start shipping there.</p><div class="mchips">'+s.regions.map(r=>'<button class="mchip'+(r.on?' on':'')+'" data-mop="serve" data-f="'+fid+'" data-r="'+r.id+'" data-on="'+(r.on?0:1)+'">'+(r.on?'✓ ':'')+esc(r.city)+'</button>').join('')+'</div>';
  else h+='<p class="mphint">You set a '+(s.mode==='exact'?'fixed number per region':'custom split')+' on the Factories page.</p>';
  h+=s.plans.map(p=>'<div class="mship"><b>'+esc(p.name)+'</b> · '+p.n+' a month → '+(p.n<=0?'nothing built':p.plan&&p.plan.length?p.plan.map(q=>esc(q.city)+' '+q.u).join(', '):'stays at the works')+'</div>').join('');
  return h;}

let ADDN={};
function growBox(fid){const m=OP().facMore(fid);if(!m) return '';const M=HOST.money;const n=ADDN[fid]||1;let h='<h4 class="mh">Grow this works</h4>';
  h+='<div class="mprow"><div class="mpn"><b>Add lines</b><span>'+M(m.lineCost)+' each, paid over 3 months'+(m.pending?' · '+m.pending+' already being built':'')+'</span></div><div class="mpc"><button class="mbtn ghost" data-mop="addn" data-f="'+fid+'" data-d="-1"'+(n<=1?' disabled':'')+'>−</button><b class="mval">'+n+'</b><button class="mbtn ghost" data-mop="addn" data-f="'+fid+'" data-d="1">+</button></div></div>';
  h+='<button class="mbtn" data-mop="addlines" data-f="'+fid+'">Build '+n+' line'+(n>1?'s':'')+' · '+M(m.lineCost*n)+'</button>';
  if(m.upgrade) h+='<p class="mphint"><b>Upgrading</b> to '+esc(m.upgrade.to.toLowerCase())+', ready in '+m.upgrade.left+' mo. '+M(m.upgrade.owed)+' still to pay. The works keeps running.</p>';
  else if(m.nexts.length) h+=m.nexts.map(x=>'<div class="mupg"><b>'+esc(x.name)+'</b><span>'+esc(x.desc)+' About '+x.gain+'% more cars from every line.</span><button class="mbtn ghost" data-mop="upg" data-f="'+fid+'" data-to="'+x.id+'">Upgrade · '+M(x.cost)+' over '+m.months+' months</button></div>').join('');
  else h+='<p class="mphint">No better way of building cars has been invented yet.</p>';
  return h;}
window.__mapSync=sync;
function rebuild(){build();draw();}

addEventListener('resize',resize);
resize();requestAnimationFrame(tick);
window.__map={showCountry,showTown,openRegion,get cam(){return cam},openSite,draw,build,sync,focusSite:k=>{focusSite(k);}};
try{sync();}catch(e){const el=document.getElementById('err');if(el){el.style.display='block';el.textContent='Map error: '+(e.message||e);}}
})();

</script>
